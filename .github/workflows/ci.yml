name: Source checks

# Safe for forks: runs on `pull_request` only (no privileged PR trigger), with a
# read-only token, no secrets and GitHub-hosted runners. The Postgres service
# and the values in `env` are throwaway CI placeholders.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Source checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: timewren_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      TZ: UTC
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_BRAND: timewren
      DATABASE_URL: postgresql://postgres@localhost:5432/timewren_test
      TEST_DATABASE_URL: postgresql://postgres@localhost:5432/timewren_test
      BETTER_AUTH_SECRET: timewren-ci-only-placeholder-not-for-deployment
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: python3 scripts/check-license-policy.py
      - run: npm run lint
      - run: node scripts/check-migration-journal.mjs
      - run: npm run i18n:check
      - run: npm run release:check
      - run: npx drizzle-kit push --force
        env:
          NODE_ENV: production
      - run: npm run test:unit -- --maxWorkers=1
      - run: npm run test:model
        env:
          TT_DB_TESTS: "1"
      - run: npm run build
