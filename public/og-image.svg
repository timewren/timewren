<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <rect width="1200" height="630" fill="url(#gradient)"/>
  <defs>
    <linearGradient id="gradient" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
  </defs>

  <!-- Clock circle icon -->
  <circle cx="200" cy="315" r="80" stroke="white" stroke-width="8" fill="none" opacity="0.3"/>

  <!-- Main heading -->
  <text x="350" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="bold" fill="white">
    TimeTrack
  </text>

  <!-- Subheading -->
  <text x="350" y="350" font-family="system-ui, -apple-system, sans-serif" font-size="36" fill="white" opacity="0.9">
    Dansk CRM til Freelancere
  </text>

  <!-- Tagline -->
  <text x="350" y="410" font-family="system-ui, -apple-system, sans-serif" font-size="28" fill="white" opacity="0.8">
    Klippekort • Tidstracking • Fakturering
  </text>

  <!-- Beta badge -->
  <rect x="350" y="450" width="280" height="50" rx="25" fill="white" opacity="0.2"/>
  <text x="420" y="485" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="600" fill="white">
    Beta Q1 2026
  </text>
</svg>
