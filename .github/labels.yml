# Labels for the public repository. Triage rules: docs/oss/maintaining.md.
# Format: one "- name/color/description" block per label, color as hex without "#".
# Issue forms in .github/ISSUE_TEMPLATE/ may only use labels from this file.

# Type
- name: "type: bug"
  color: "d73a4a"
  description: "Something does not work as documented"
- name: "type: feature"
  color: "1d76db"
  description: "A new capability or a change to an existing one"
- name: "type: docs"
  color: "0075ca"
  description: "Documentation, guides and examples"
- name: "type: chore"
  color: "c5def5"
  description: "Build, CI, refactoring or dependencies"

# Area
- name: "area: time tracking"
  color: "bfd4f2"
  description: "Timer, time entries, week view, calendar"
- name: "area: prepaid hours"
  color: "bfd4f2"
  description: "Prepaid hour packages (klippekort) and balances"
- name: "area: invoicing"
  color: "bfd4f2"
  description: "Invoices, PDF and accounting integrations"
- name: "area: clients and projects"
  color: "bfd4f2"
  description: "Clients, projects, tasks, client portal"
- name: "area: teams"
  color: "bfd4f2"
  description: "Organisations, roles, approvals, audit log"
- name: "area: api"
  color: "bfd4f2"
  description: "tRPC API, webhooks and the MCP server"
- name: "area: i18n"
  color: "bfd4f2"
  description: "Translations and locale formatting"
- name: "area: self-hosting"
  color: "bfd4f2"
  description: "Docker image, Compose, install and upgrades"
- name: "area: extension"
  color: "bfd4f2"
  description: "Browser extension"
- name: "area: desktop"
  color: "bfd4f2"
  description: "Desktop app"
- name: "area: mobile"
  color: "bfd4f2"
  description: "Mobile app"

# Priority (set by a maintainer during triage)
- name: "priority: critical"
  color: "b60205"
  description: "Data loss, security or a broken install; fixed before anything else"
- name: "priority: high"
  color: "d93f0b"
  description: "Blocks common use; planned for the next release"
- name: "priority: normal"
  color: "fbca04"
  description: "Planned when there is time"
- name: "priority: low"
  color: "fef2c0"
  description: "Nice to have"

# Status
- name: "needs-triage"
  color: "ededed"
  description: "Not looked at by a maintainer yet"
- name: "needs-repro"
  color: "e99695"
  description: "Needs steps to reproduce before work can start"
- name: "needs-decision"
  color: "d4c5f9"
  description: "Waiting for a maintainer decision on scope or approach"
- name: "good first issue"
  color: "7057ff"
  description: "Small, well described and a good place to start"
- name: "help wanted"
  color: "008672"
  description: "A maintainer would welcome a pull request"
- name: "security"
  color: "b60205"
  description: "Security hardening (vulnerabilities go to private advisories)"
- name: "breaking"
  color: "b60205"
  description: "Changes behaviour, configuration or the API; needs migration notes"
- name: "duplicate"
  color: "cfd3d7"
  description: "Already reported elsewhere"
- name: "out of scope"
  color: "cfd3d7"
  description: "Will not be done in this project"
- name: "dependencies"
  color: "0366d6"
  description: "Dependency updates"
