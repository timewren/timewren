# Paid plans are required for persistent storage and the scheduler worker.
services:
  - type: web
    name: timewren
    runtime: image
    image:
      url: ghcr.io/timewren/timewren:latest
    plan: starter
    region: frankfurt
    healthCheckPath: /api/health
    numInstances: 1
    disk:
      name: timewren-storage
      mountPath: /app/data/storage
      sizeGB: 10
    envVars:
      - key: PORT
        value: "3000"
      - key: HOSTNAME
        value: 0.0.0.0
      - key: NEXT_PUBLIC_BRAND
        value: timewren
      - key: NEXT_PUBLIC_APP_URL
        fromService:
          type: web
          name: timewren
          envVarKey: RENDER_EXTERNAL_URL
      - key: DATABASE_URL
        fromDatabase:
          name: timewren-db
          property: connectionString
      - key: BETTER_AUTH_SECRET
        generateValue: true
      # Must be 64 hex characters. Render's generateValue emits base64 instead.
      - key: ENCRYPTION_KEY
        sync: false
      - key: CRON_SECRET
        generateValue: true
      - key: MIGRATE_ON_START
        value: "1"
      - key: STORAGE_DRIVER
        value: local
      - key: STORAGE_LOCAL_PATH
        value: /app/data/storage
      - key: REQUIRE_EMAIL_VERIFICATION
        value: "false"
      - key: TZ
        value: Europe/Copenhagen
  - type: worker
    name: timewren-cron
    runtime: image
    image:
      url: ghcr.io/timewren/timewren:latest
    plan: starter
    region: frankfurt
    dockerCommand: sh -c 'APP_URL="http://$APP_URL" exec node scripts/cron.mjs'
    numInstances: 1
    envVars:
      - key: APP_URL
        fromService:
          type: web
          name: timewren
          property: hostport
      - key: CRON_SECRET
        fromService:
          type: web
          name: timewren
          envVarKey: CRON_SECRET
      - key: TZ
        value: Europe/Copenhagen
databases:
  - name: timewren-db
    plan: basic-256mb
    region: frankfurt
    postgresMajorVersion: "18"
    databaseName: timetrack
    user: timetrack
