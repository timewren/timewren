[package]
license = "AGPL-3.0-only"
name = "tt-matcher"
version = "0.1.0"
edition = "2024"
publish = false
description = "Gør aktivitet til forslag: regler, identitet, lærte mønstre og navnematching. Ren Rust, ingen IO."

[dependencies]
