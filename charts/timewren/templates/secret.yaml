{{- if not .Values.existingSecret }}
{{- $name := include "timewren.name" . }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name) | default dict }}
{{- $data := get $existing "data" | default dict }}
{{- $values := dict }}
{{- range $key := list "POSTGRES_PASSWORD" "BETTER_AUTH_SECRET" "ENCRYPTION_KEY" "CRON_SECRET" }}
{{- $value := index $.Values.secrets $key | default "" }}
{{- if not $value }}
{{- if hasKey $data $key }}
{{- $value = index $data $key | b64dec }}
{{- else if eq $key "ENCRYPTION_KEY" }}
{{- $value = randAlphaNum 64 | sha256sum }}
{{- else }}
{{- $value = randAlphaNum 64 }}
{{- end }}
{{- end }}
{{- $_ := set $values $key $value }}
{{- end }}
{{- if not (regexMatch "^[a-fA-F0-9]{64}$" (get $values "ENCRYPTION_KEY")) }}
{{- fail "secrets.ENCRYPTION_KEY must be exactly 64 hexadecimal characters" }}
{{- end }}
{{- $databaseUrl := .Values.secrets.DATABASE_URL }}
{{- if .Values.postgresql.enabled }}
{{- $databaseUrl = printf "postgresql://timewren:%s@%s-postgresql:5432/timewren" (get $values "POSTGRES_PASSWORD" | urlquery | replace "+" "%20") $name }}
{{- else }}
{{- $databaseUrl = required "Set secrets.DATABASE_URL or existingSecret for external PostgreSQL" $databaseUrl }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "timewren.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ $databaseUrl | quote }}
  {{- range $key, $value := $values }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- if .Values.valkey.enabled }}
  VALKEY_URL: {{ printf "redis://%s-valkey:6379" $name | quote }}
  {{- end }}
{{- end }}
