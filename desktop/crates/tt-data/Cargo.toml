[package]
license = "AGPL-3.0-only"
name = "tt-data"
version = "0.1.0"
edition = "2024"
publish = false
description = "TimeTrack Desktop 1.0: datalaget bag én grænseflade (CloudRepo og LocalRepo)"

[features]
default = []
# Mock af web-appens tRPC-API (std::net + LocalRepo) til tests og udvikling.
mock = []

[dependencies]
tt-core.workspace = true
async-trait = "=0.1.92"
async-channel.workspace = true
blocking = "=1.7.0"
futures-lite.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono = { workspace = true, features = ["clock"] }
uuid = { version = "=1.29.0", features = ["v4", "serde"] }
rust_decimal = { version = "=1.43.0", default-features = false, features = ["std", "serde", "serde-with-float"] }
rusqlite = { workspace = true, features = ["bundled", "backup"] }
ureq.workspace = true
url = "=2.5.8"
sha2.workspace = true
base64 = "=0.22.1"
parking_lot = "=0.12.5"
thiserror.workspace = true
log = "=0.4.34"

[dev-dependencies]
# Slår mock-featuren til for crate'ens egne integrationstests.
tt-data = { path = ".", features = ["mock"] }
tempfile.workspace = true
