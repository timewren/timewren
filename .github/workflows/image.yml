name: Publish image

# Builds the multi-arch container image from a release tag and pushes it to
# GHCR and, when credentials exist, Docker Hub. Each architecture is built
# natively on its own runner (no QEMU), pushed by digest, and a final job
# stitches the digests into one tagged manifest list. Nothing here is specific
# to a deployment: APP_URL, MARKETING_URL and BRAND are read at runtime, so one
# image serves every self-hoster.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish from the selected ref, e.g. v1.2.3 or v1.2.3-rc.1"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: false

env:
  GHCR_IMAGE: ghcr.io/timewren/timewren
  DOCKERHUB_IMAGE: docker.io/mahoje/timewren

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      hub-enabled: ${{ steps.hub.outputs.enabled }}
      hub-image: ${{ steps.hub.outputs.image }}
    steps:
      - name: Resolve version
        id: version
        env:
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            version="$INPUT_VERSION"
          else
            version="$REF_NAME"
          fi
          if ! printf '%s' "$version" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$version' is not a version like v1.2.3 or v1.2.3-rc.1"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check for Docker Hub credentials
        id: hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "image=$DOCKERHUB_IMAGE" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "image=" >> "$GITHUB_OUTPUT"
            echo "::notice::DOCKERHUB_USERNAME/DOCKERHUB_TOKEN are not set, so Docker Hub is skipped. Only GHCR is published."
          fi

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # The tag must match package.json and a dated CHANGELOG.md section.
      - name: Check release metadata
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: node scripts/release/check.mjs --tag "$VERSION"

  build:
    needs: prepare
    name: build (${{ matrix.platform }})
    strategy:
      fail-fast: true
      matrix:
        include:
          - { platform: linux/amd64, runner: ubuntu-24.04, pair: linux-amd64 }
          - {
              platform: linux/arm64,
              runner: ubuntu-24.04-arm,
              pair: linux-arm64,
            }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: needs.prepare.outputs.hub-enabled == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Only labels are used here; tags are applied by the merge job.
      - name: Image labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ env.GHCR_IMAGE }}
            ${{ needs.prepare.outputs.hub-image }}
          labels: |
            org.opencontainers.image.title=TimeWren
            org.opencontainers.image.licenses=AGPL-3.0-only

      # No NEXT_PUBLIC_* build args on purpose: APP_URL, MARKETING_URL and BRAND
      # come from the container env at runtime, and the image carries no
      # analytics or error-reporting configuration. The two values below only
      # have to be non-empty for `next build`; they are not used at runtime.
      # The image is pushed by digest only; the merge job tags it. Provenance
      # and SBOM attestations are attached to each platform's image here.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BETTER_AUTH_SECRET=build-time-placeholder
            DATABASE_URL=postgresql://build:build@localhost:5432/build
            APP_VERSION=${{ github.sha }}
          provenance: mode=max
          sbom: true
          outputs: type=image,"name=${{ env.GHCR_IMAGE }}${{ needs.prepare.outputs.hub-enabled == 'true' && format(',{0}', env.DOCKERHUB_IMAGE) || '' }}",push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=image-${{ matrix.pair }}
          cache-to: type=gha,mode=max,scope=image-${{ matrix.pair }}

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.pair }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: needs.prepare.outputs.hub-enabled == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ env.GHCR_IMAGE }}
            ${{ needs.prepare.outputs.hub-image }}
          # vX.Y.Z -> X.Y.Z and X.Y. `latest` is added for stable versions only
          # (metadata-action skips it for prereleases).
          tags: |
            type=semver,pattern={{version}},value=${{ needs.prepare.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.prepare.outputs.version }}
          flavor: |
            latest=auto
          labels: |
            org.opencontainers.image.title=TimeWren
            org.opencontainers.image.licenses=AGPL-3.0-only

      # One manifest list per registry, built from that registry's digests.
      - name: Create manifest lists
        env:
          HUB_IMAGE: ${{ needs.prepare.outputs.hub-image }}
          META_JSON: ${{ steps.meta.outputs.json }}
          DIGESTS_DIR: ${{ runner.temp }}/digests
        run: |
          set -euo pipefail
          cd "$DIGESTS_DIR"
          count=$(ls | wc -l)
          if [ "$count" -ne 2 ]; then
            echo "::error::expected 2 platform digests, found $count"
            exit 1
          fi
          for image in "$GHCR_IMAGE" "$HUB_IMAGE"; do
            [ -n "$image" ] || continue
            tag_args=$(jq -cr --arg image "$image" '.tags | map(select(startswith($image + ":"))) | map("-t " + .) | join(" ")' <<< "$META_JSON")
            # shellcheck disable=SC2046,SC2086
            docker buildx imagetools create $tag_args $(printf "$image@sha256:%s " *)
          done

      - name: Inspect manifests
        env:
          HUB_IMAGE: ${{ needs.prepare.outputs.hub-image }}
          VERSION_TAG: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          for image in "$GHCR_IMAGE" "$HUB_IMAGE"; do
            [ -n "$image" ] || continue
            docker buildx imagetools inspect "$image:$VERSION_TAG"
          done
