# llama.cpp (tt-ai, feature local-llm) på x86_64: fast CPU-niveau i alle builds.
#
# Uden dette afhænger ggml's instruktionssæt af byggemaskinen: et native
# build (Windows-runneren) slår alt til, runneren har (evt. AVX-512), og et
# krydsbuild (Intel-Mac fra Apple silicon) slår alt fra (kun SSE2, langsomt).
# Vi bygger til AVX2/FMA/F16C (Intel Haswell 2013+, AMD 2015+). På ældre
# processorer og Celeron/Pentium uden AVX slår tt_ai::cpu den indbyggede model
# fra med en dansk besked, før llama.cpp bliver rørt; resten af appen virker.
# Variablerne bruges kun af llama-cpp-sys-2's build (ggml ignorerer dem på ARM).
[env]
GGML_SSE42 = "ON"
GGML_AVX = "ON"
GGML_AVX2 = "ON"
GGML_FMA = "ON"
GGML_F16C = "ON"
GGML_BMI2 = "ON"
GGML_AVX512 = "OFF"
GGML_AVX_VNNI = "OFF"
# Windows: llama.cpp med statisk C/C++-runtime (/MT), som resten nedenfor.
LLAMA_STATIC_CRT = "1"

# Windows: statisk C-runtime i hele exe'en. Ellers kræver den VCRUNTIME140.dll
# og (med llama.cpp) MSVCP140.dll, som ikke følger med Windows, og en ældre
# VC++-runtime end byggeværktøjets kan gå ned i std::mutex. Tauri-appen linkede
# også runtimen statisk. Bemærk: RUSTFLAGS i miljøet tilsidesætter dette.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

# Windows: CMake 4 (CMP0091 NEW) ignorerer -MT fra cmake-rs og bygger
# llama.cpp med /MD, så linkningen fejler med LNK2038. Toolchain-filen sætter
# CMAKE_MSVC_RUNTIME_LIBRARY til den statiske runtime. Kun for MSVC-targetet.
[env.CMAKE_TOOLCHAIN_FILE_x86_64-pc-windows-msvc]
value = "scripts/cmake/msvc-static-crt.cmake"
relative = true
