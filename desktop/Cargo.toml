# TimeTrack Desktop 1.0: ét Cargo-workspace for de nye Rust-crates.
# Den gamle Tauri-app (src-tauri/) er ikke med og bygges stadig for sig.
[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["src-tauri"]

# Delte afhængigheder, pinnet eksakt. Crates bruger dem med `x.workspace = true`.
[workspace.dependencies]
tt-core = { path = "crates/tt-core" }
tt-data = { path = "crates/tt-data" }
tt-tracker = { path = "crates/tt-tracker" }
tt-matcher = { path = "crates/tt-matcher" }
tt-ai = { path = "crates/tt-ai" }

serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
chrono = { version = "=0.4.45", default-features = false, features = ["std", "serde"] }
chrono-tz = { version = "=0.10.4", default-features = false }
thiserror = "=2.0.21"
rusqlite = "=0.40.2"
ureq = { version = "=3.5.0", default-features = false, features = ["json", "rustls"] }
sha2 = "=0.10.9"
futures-lite = "=2.6.1"
async-channel = "=2.5.0"
tiny_http = "=0.12.0"
tempfile = "=3.27.0"
rust_decimal = { version = "=1.43.0", default-features = false, features = ["std"] }
# OS-nøglering (keyring v4-familien), samme versioner som tt-ai.
keyring-core = "=1.0.1"
apple-native-keyring-store = { version = "=1.0.2", features = ["keychain"] }
windows-native-keyring-store = "=1.1.0"

# Udvikling og tests (test arver dev). line-tables-only bevarer fil og linje i
# backtraces, men dropper variabel- og typeinfo: mindre target-mappe og
# hurtigere link. Brug `CARGO_PROFILE_DEV_DEBUG=true` til en debugger-session.
[profile.dev]
debug = "line-tables-only"

# Matcherens regressions- og præcisionstests genberegner Platt-gitteret efter
# hver rettelse; uoptimeret er de suitens langsomste tests.
[profile.dev.package.tt-matcher]
opt-level = 3

# Udgivelsesprofilen for den nye app (tt-app). Målt på Linux, 16/11-26:
# thin LTO/16 CGU gav 63,8 MB, opt-level 3 + fat LTO 52,0 MB, "s" 38,7 MB og
# "z" 35,5 MB. "z" er droppet: kun 8 % mindre end "s", men uden
# loop-vektorisering, som GPUI's tegning og tekstlayout har gavn af.
# panic forbliver "unwind": tt-tracker fanger panik i OS-sonderne med
# catch_unwind, så sporingen overlever, og GPUI bruger også catch_unwind.
# CI's release-build på PR'er overstyrer LTO og CGU med CARGO_PROFILE_RELEASE_*
# (se .forgejo/workflows/v1.yml), fordi fat LTO gør et inkrementelt build
# ca. fire gange langsommere. Udgivelserne bygger med profilen her.
[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = true
